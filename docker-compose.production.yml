volumes:
  pg_data:
  static:
  media:

services:
  db:
    image: postgres:13
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: always
  backend:
    image: daniil1980/kittygram_backend:latest
    env_file: .env
    volumes:
    - static:/backend_static
    - media:/app/media
    depends_on:
    - db
    restart: always
  frontend:
    env_file: .env
    image: daniil1980/kittygram_frontend:latest
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static:/frontend_static
    restart: always
  gateway:
    image: daniil1980/kittygram_gateway:latest
    env_file: .env
    ports:
      - 9000:80
    depends_on:
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template
      - static:/staticfiles
      - media:/app/media
    restart: always