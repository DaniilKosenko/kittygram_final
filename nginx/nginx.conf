server {
    listen 80;
    server_name localhost;

    # ГЛАВНОЕ ИСПРАВЛЕНИЕ:
    # Все запросы, которые начинаются с /media/, берем из папки /app/media внутри контейнера
    location /media/ {
        alias /app/media/;
        # Важно: слеши должны совпадать. У нас папка /app/media/, поэтому алиас тоже с слэшем.
    }

    # Статика (CSS, JS) из сборки фронтенда
    location /static/ {
        alias /staticfiles/;
    }

    # Всё остальное (API и сам сайт)
    location / {
        # Если запрос к API (/api/...) -> шлем на backend
        if ($request_uri ~ ^/api/) {
            proxy_pass http://backend:9000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        # Иначе считаем, что это фронтенд, и отдаем index.html
        try_files $uri $uri/ /index.html;
    }
}